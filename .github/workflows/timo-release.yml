name: Timo Release

on:
  push:
    tags: ['v*-timo.*']

permissions:
  contents: read

concurrency:
  group: timo-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Timo-In/glow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tag and branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate fork tag and stable branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-timo\.[0-9]+$ ]]; then
            echo "Invalid fork release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/timo/main

  checks:
    needs: validate
    uses: ./.github/workflows/timo-ci.yml

  release:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Publish release assets
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --config .goreleaser.timo.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Homebrew formula
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/timo-generate-homebrew-formula.sh \
            "$version" \
            "$GITHUB_REF_NAME" \
            dist/checksums.txt \
            "$RUNNER_TEMP/glow-timo.rb"
      - name: Upload Homebrew formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timo-homebrew
          path: ${{ runner.temp }}/glow-timo.rb
          if-no-files-found: error

  homebrew:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Timo-In/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap
      - name: Download Homebrew formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timo-homebrew
          path: formula
      - name: Validate and commit Homebrew formula
        working-directory: tap
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p Formula
          cp ../formula/glow-timo.rb Formula/glow-timo.rb
          ruby -c Formula/glow-timo.rb
          brew style Formula/glow-timo.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/glow-timo.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(brew): update glow-timo to $RELEASE_TAG"
          fi
      - name: Test installation from generated formula
        shell: bash
        run: |
          brew tap --custom-remote timo-ci/glow "$PWD/tap"
          brew install timo-ci/glow/glow-timo
          brew test timo-ci/glow/glow-timo
      - name: Publish Homebrew formula
        working-directory: tap
        run: git push origin HEAD:main
