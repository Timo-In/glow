# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: glow-timo

builds:
  - id: glow
    main: .
    binary: glow
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X main.CommitSHA={{ .Commit }}

archives:
  - id: glow
    ids:
      - glow
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: Timo-In
    name: glow
  name_template: "glow-timo {{ .Tag }}"
